name: Build & Release Jellyfin Plugin

# How to ship a new plugin version (no local tooling, no manual tags):
#   1. Bump <Version> in Jellyfin.Plugin.Tessera.csproj (e.g. 1.0.46 → 1.0.47)
#   2. Push the commit to main
#   3. This workflow creates tag vX.Y.Z, builds the zip, publishes the GitHub Release,
#      and updates manifest.json for the Jellyfin plugin catalog
#
# Commits that do not bump Version are no-ops (tag already exists).
# Manifest bot commits use [skip ci] and are ignored.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from csproj
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Jellyfin.Plugin.Tessera.csproj | head -1)
          if [[ -z "$VERSION" ]]; then
            echo "Could not read <Version> from Jellyfin.Plugin.Tessera.csproj" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "csproj Version=$VERSION → $TAG"

      - name: Check whether this version was already released
        id: check
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG is new — will build and release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET 8.0 SDK
        if: steps.check.outputs.should_release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Release Binary
        if: steps.check.outputs.should_release == 'true'
        run: dotnet build -c Release -v n -p:Version=${{ env.VERSION }}

      - name: Package Plugin Zip
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          mkdir -p package
          DLL=$(find bin/Release -name 'Jellyfin.Plugin.Tessera.dll' | head -1)
          if [[ -z "$DLL" ]]; then
            echo "Build output DLL not found" >&2
            find bin -type f -name '*.dll' || true
            exit 1
          fi
          cp "$DLL" package/
          python3 - <<'PY'
          import json, datetime, os
          version = os.environ["VERSION"]
          version_str = version if version.count(".") >= 3 else version + ".0"
          meta = {
              "guid": "f94d1b82-7e4a-4c28-9d10-8b43f01c9b88",
              "name": "Tessera",
              "description": "Per-second streaming payments and tipping for Jellyfin, powered by Tessera.",
              "overview": "Let your viewers support your Jellyfin server with per-second USDC micropayments or tips.",
              "owner": "Tessera Project",
              "category": "General",
              "targetAbi": "10.9.0.0",
              "version": version_str,
              "changelog": f"Automated release for version {version_str}",
              "timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("package/meta.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
          print("Wrote package/meta.json:", meta)
          PY
          cd package
          zip -r ../Jellyfin.Plugin.Tessera.zip .
          unzip -l ../Jellyfin.Plugin.Tessera.zip

      - name: Calculate Checksums
        if: steps.check.outputs.should_release == 'true'
        run: |
          SHA256_SUM=$(sha256sum Jellyfin.Plugin.Tessera.zip | awk '{ print $1 }')
          MD5_SUM=$(md5sum Jellyfin.Plugin.Tessera.zip | awk '{ print toupper($1) }')
          echo "SHA256=$SHA256_SUM" >> "$GITHUB_ENV"
          echo "MD5=$MD5_SUM" >> "$GITHUB_ENV"
          echo "Calculated SHA256: $SHA256_SUM"
          echo "Calculated MD5: $MD5_SUM"

      - name: Create tag + GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: Jellyfin.Plugin.Tessera.zip
          generate_release_notes: true
          body: |
            Automated release build for Jellyfin Tessera Plugin **${{ env.TAG }}**.

            - SHA256: `${{ env.SHA256 }}`
            - MD5: `${{ env.MD5 }}`

            Install via the Tessera plugin repository manifest, or download the zip and install manually in Jellyfin Dashboard → Plugins.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update and Push manifest.json
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stay on main tip so we don't fight with concurrent pushes
          git fetch origin main
          git checkout -B main origin/main

          python3 -c "
          import json, datetime

          manifest_path = 'manifest.json'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              data = json.load(f)

          version_str = '${VERSION}'
          if version_str.count('.') == 2:
              version_str += '.0'

          new_entry = {
              'version': version_str,
              'changelog': 'Automated release for version ' + version_str,
              'targetAbiVersion': '10.9.0.0',
              'sourceUrl': f'https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Jellyfin.Plugin.Tessera.zip',
              'checksum': '${{ env.MD5 }}',
              'timestamp': datetime.datetime.utcnow().isoformat() + 'Z'
          }

          if not any(v['version'] == version_str for v in data[0]['versions']):
              data[0]['versions'].insert(0, new_entry)
              print('Inserted version ' + version_str)
          else:
              print('Version already exists in manifest: ' + version_str)
          # Keep the catalog short (latest N only). Older zips remain on GitHub Releases.
          data[0]['versions'] = data[0]['versions'][:5]
          with open(manifest_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          print('Kept %d manifest version entries' % len(data[0]['versions']))
          "

          git add manifest.json
          git commit -m "chore: auto-update manifest.json for release v${VERSION} [skip ci]" || echo "No changes to commit"
          git push origin main
